# OpenRemote v3
#
# Profile that runs the stack by default on the docker host port 443 using HTTPS with a self-signed SSL certificate,
# but optionally on https://$OR_HOSTNAME with an auto generated SSL certificate from Letsencrypt.
#
# It is configured to use the AWS logging driver.
#
volumes:
  proxy-data:
  manager-data:
  postgresql-data:

services:
  proxy:
    image: openremote/proxy:${PROXY_VERSION:-2.8.24.0}
    restart: always
    depends_on:
      manager:
        condition: service_healthy
    ports:
      - "${OR_HTTP_PORT:-80}:80" # Needed for SSL generation using letsencrypt; set OR_HTTP_PORT if port 80 is taken
      - "${OR_SSL_PORT:-443}:443"
      - "8883:8883"
      - "127.0.0.1:8404:8404" # Local metrics access
      - "${PRIVATE_IP:-127.0.0.1}:8404:8404" # Allows to also expose metrics on a given IP address,
        # intended to be IP of the interface of the private subnet of the EC2 VM
    volumes:
      - proxy-data:/deployment
    environment:
      LE_EMAIL: ${OR_EMAIL_ADMIN:-}
      DOMAINNAME: ${OR_HOSTNAME:-localhost}
      DOMAINNAMES: ${OR_ADDITIONAL_HOSTNAMES:-}
      # USE A CUSTOM PROXY CONFIG - COPY FROM https://raw.githubusercontent.com/openremote/proxy/main/haproxy.cfg
      #HAPROXY_CONFIG: '/data/proxy/haproxy.cfg'
    labels:
      # The proxy is the single entry point (HTTPS 443: /auth -> keycloak, everything else -> manager)
      tsdproxy.enable: "true"
      tsdproxy.name: "openremote-algeria"
      tsdproxy.container_port: "443"
      tsdproxy.scheme: "https"
      tsdproxy.tlsvalidate: "false" # the proxy uses a self-signed certificate
      tsdproxy.funnel: "true"

  postgresql:
    restart: always
    image: openremote/postgresql:${POSTGRESQL_VERSION:-17.9.0.1-slim}
    shm_size: 128mb
    volumes:
      - postgresql-data:/var/lib/postgresql/data

  keycloak:
    restart: always
    image: openremote/keycloak:${KEYCLOAK_VERSION:-26.7.3.0}
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./deployment:/deployment
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:-secret}
      # Keycloak <= 25 (e.g. openremote/keycloak:23.x) reads the admin password from this variable instead
      KEYCLOAK_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:-secret}
      KC_HOSTNAME: https://${OR_HOSTNAME:-localhost}/auth

  manager:
    #    privileged: true
    restart: always
    image: ${MANAGER_IMAGE:-ghcr.io/ilyeseia/openremote-algeria-manager}:${MANAGER_VERSION:-latest}
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:8405:8405" # Local metrics access
      - "${PRIVATE_IP:-127.0.0.1}:8405:8405" # Allows to also expose metrics on a given IP address,
        # intended to be IP of the interface of the private subnet of the EC2 VM
    environment:
      OR_SETUP_TYPE:
      OR_ADMIN_PASSWORD:
      OR_SETUP_RUN_ON_RESTART:
      OR_EMAIL_HOST:
      OR_EMAIL_USER:
      OR_EMAIL_PASSWORD:
      OR_EMAIL_X_HEADERS:
      OR_EMAIL_FROM:
      OR_EMAIL_ADMIN:
      OR_METRICS_ENABLED: ${OR_METRICS_ENABLED:-true}
      OR_HOSTNAME: ${OR_HOSTNAME:-localhost}
      OR_ADDITIONAL_HOSTNAMES:
      OR_SSL_PORT: ${OR_SSL_PORT:--1}
      OR_DEV_MODE: ${OR_DEV_MODE:-false}
      # Time zone of the manager JVM (rules, schedules, logs); set OR_TIMEZONE to change it
      TZ: ${OR_TIMEZONE:-Africa/Algiers}

      # Opt-in OpenTelemetry tracing to a local Alloy OTLP/HTTP receiver.
      OTEL_JAVAAGENT_ENABLED: ${OTEL_JAVAAGENT_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-openremote-manager}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_INSTRUMENTATION_COMMON_DB_STATEMENT_SANITIZER_ENABLED: "true"

      # The following variables will configure the demo
      OR_FORECAST_SOLAR_API_KEY:
      OR_OPEN_WEATHER_API_APP_ID:
      OR_SETUP_IMPORT_DEMO_AGENT_KNX:
      OR_SETUP_IMPORT_DEMO_AGENT_VELBUS:
    volumes:
      - manager-data:/storage
      # Map centred on Algeria (the bundled vector tiles only cover Rotterdam)
      - ./deployment/map/mapsettings.json:/deployment/map/mapsettings.json:ro
