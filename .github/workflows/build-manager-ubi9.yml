name: Build manager image (UBI 9, for x86-64-v2 CPUs)

# Builds the manager from this repository (Arabic default language + RTL) on the UBI 9 base image, which unlike
# UBI 10 runs on CPUs without x86-64-v3 (AVX2). Publishes ghcr.io/<owner>/openremote-algeria-manager.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Only rebuild when something baked into the image changes (not docs, compose or the mounted deployment config)
    paths:
      - "ui/**"
      - "manager/**"
      - "model/**"
      - "model-util/**"
      - "agent/**"
      - "container/**"
      - "setup/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "buildSrc/**"
      - ".github/workflows/build-manager-ubi9.yml"

concurrency:
  group: build-manager-ubi9
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Manager image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true # Enable Git LFS plugin to fetch *.mbtiles

      - name: Set up JDK 21 and Gradle cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Run Install Dist
        timeout-minutes: 40
        run: ./gradlew installDist -x :deployment:installDist

      - name: Install Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/openremote-algeria-manager" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push manager image
        timeout-minutes: 20
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: manager/build/install/manager
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
